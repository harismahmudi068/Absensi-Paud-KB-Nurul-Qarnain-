<div class="scene" id="scene"></div>
<div class="top"><div class="as">Assalamualaikum</div><div class="nm" id="nm">&nbsp;</div><div class="gt" id="gt">&nbsp;</div></div>
<div class="wrap">
 <div class="clk"><div class="pill" id="jm">--<i>:</i>-- <small>WIB</small></div><div class="pill" id="tg">&nbsp;</div></div>
 <div class="bar"><div class="menu" id="menu">
  <button class="mbtn fx" onclick="mT(event)"><span class="ic" id="mic">🏠</span><span class="t" id="mt">Dashboard</span><svg class="ch" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>

<div class="ov" id="ov"></div><div class="eo" id="eo" role="dialog" aria-modal="true" aria-live="polite"></div><div class="fo" id="fo"></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'],HR=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const ST={hadir:['Hadir','#d9f7e8','#14965c'],terlambat:['Terlambat','#fff0c2','#9a6a00'],izin:['Izin','#dcefff','#1673bd'],sakit:['Sakit','#ffe0e4','#d83d4d'],alpa:['Alpa','#eadfff','#6840c6'],libur:['Libur','#e5edf4','#526b84']};
const tgl=d=>{const p=String(d).split('-');return +p[2]+' '+BLN[p[1]-1]+' '+p[0]},hari=d=>HR[new Date(d+'T00:00:00').getDay()];
const jam=iso=>iso?new Date(iso).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Jakarta'}):'';
const rp=n=>'Rp '+Number(n).toLocaleString('id-ID');
const m=location.pathname.match(/^\/p\/([0-9a-f-]{36})\/?$/i);
const MENU=[['dashboard','🏠','Dashboard'],['siswa','👤','Data Siswa'],['absensi','📅','Rekap Absensi'],['tabungan','💰','Tabungan'],['libur','🎉','Kalender Hari Libur']];
const C={},S={},LAP={st:'',busy:0};let cur='',tok=0;
const segar=v=>C[v];

/* ---------- efek ripple ---------- */
document.addEventListener('pointerdown',e=>{const el=e.target.closest('.fx');if(!el)return;const r=el.getBoundingClientRect(),d=Math.max(r.width,r.height)*2,s=document.createElement('span');s.className='rp';s.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';el.appendChild(s);setTimeout(()=>s.remove(),600)});

/* ---------- menu custom ---------- */
function bangunMenu(){$('#mlist').innerHTML=MENU.map((x,i)=>'<button class="mi fx'+(x[0]===cur?' on':'')+'" style="transition-delay:'+(i*35)+'ms" onclick="go(\''+x[0]+'\')"><span class="ic">'+x[1]+'</span>'+x[2]+'</button>').join('')}
function mT(e){e.stopPropagation();$('#menu').classList.toggle('open');ddTutup()}
function mTutup(){$('#menu').classList.remove('open')}

/* ---------- dropdown custom ---------- */
const DD={};
function dd(id,opts,val,cb){DD[id]={opts,val,cb};const o=opts.find(x=>x.v===val)||opts[0];
 return '<div class="dd" id="dd-'+id+'"><button class="ddb fx" onclick="ddT(\''+id+'\',event)"><span>'+esc(o.t)+'</span><i>▾</i></button><div class="ddl">'+opts.map(x=>'<div class="ddo fx'+(x.v===val?' on':'')+'" onclick="ddP(\''+id+'\',\''+x.v+'\',event)">'+esc(x.t)+'</div>').join('')+'</div></div>'}
function ddT(id,e){e.stopPropagation();const el=$('#dd-'+id),was=el.classList.contains('open');ddTutup();mTutup();if(!was){el.classList.add('open');const on=el.querySelector('.ddo.on');if(on)el.querySelector('.ddl').scrollTop=on.offsetTop-60}}
function ddP(id,v,e){e.stopPropagation();const d=DD[id];d.val=v;const el=$('#dd-'+id);el.querySelector('.ddb span').textContent=d.opts.find(x=>x.v===v).t;el.querySelectorAll('.ddo').forEach(n=>n.classList.toggle('on',n.getAttribute('onclick').includes("'"+v+"'")));setTimeout(()=>el.classList.remove('open'),120);d.cb(v)}
function ddTutup(){document.querySelectorAll('.dd.open').forEach(n=>n.classList.remove('open'))}
document.addEventListener('click',()=>{ddTutup();mTutup()});

/* ---------- pemuatan per halaman ---------- */
function pesan(j,t){$('#isi').innerHTML='<div class="msg"><div style="font-size:44px">'+j+'</div><h2>'+esc(t[0])+'</h2><div class="mu">'+esc(t[1])+'</div></div>'}
function loading(){$('#isi').innerHTML='<div class="sk"></div><div class="sk" style="height:140px"></div><div class="sk"></div>'}
async function ambil(v){
 if(segar(v))return C[v];
 const r=await fetch('/api/portal?k='+m[1]+'&v='+v,{cache:'no-store'});
 if(r.status===404){const e=new Error('404');e.nf=1;throw e}
 if(!r.ok)throw 0;const d=await r.json();C[v]=d;S.siswa=d.siswa;S.sekolah=d.sekolah;S.hari=d.hari_ini;if(d.libur)S.libur=d.libur;
 $('#nm').textContent=d.siswa.nama||'';if(d.v==='dashboard')sapa(d);document.title=(d.sekolah.nama?d.sekolah.nama+' - ':'')+'Halaman Siswa';return d}
async function go(v){
 mTutup();ddTutup();
 if(!m)return pesan('🔎',['Kartu tidak ditemukan','Pindai ulang QR pada kartu anak Anda.']);
 const t=++tok;cur=v;const mi=MENU.find(x=>x[0]===v);$('#mic').textContent=mi[1];$('#mt').textContent=mi[2];bangunMenu();
 if(!segar(v))loading();scrollTo({top:0,behavior:'smooth'});
 try{const d=await ambil(v);if(t!==tok)return;$('#isi').innerHTML='<div class="pg">'+R[v](d)+'</div>';if(A[v])A[v](d)}
 catch(e){if(t!==tok)return;e&&e.nf?pesan('🔎',['Kartu tidak ditemukan','Kartu tidak aktif atau QR tidak dikenal. Hubungi pihak sekolah.']):pesan('⚠️',['Gagal memuat','Periksa koneksi internet lalu muat ulang halaman.'])}}
const badge=a=>{const t=ST[a.status]||[a.status,'#eee','#333'];return '<span class="bd" style="background:'+t[1]+';color:'+t[2]+'">'+esc(t[0])+'</span>'};
const trx=t=>'<div class="li"><div><b>'+(t.jenis==='setor'?'Setoran':'Penarikan')+'</b><small>'+tgl(t.tanggal)+' · saldo '+rp(t.saldo)+'</small></div><b style="color:'+(t.jenis==='setor'?'#14965c':'#d83d4d')+'">'+(t.jenis==='setor'?'+':'-')+rp(t.jumlah)+'</b></div>';
const R={},A={};

/* A. Dashboard */
/* Notifikasi profil anak belum lengkap (hanya data yang bisa diisi orang tua) */
const PKOL=[['pan','Nama panggilan'],['tgl','Tanggal lahir'],['jk','Jenis kelamin'],['alamat','Alamat'],['wa','WhatsApp orang tua']];
function profilKurang(s){return PKOL.filter(x=>!s[x[0]]).map(x=>x[1])}
function profilKosong(s){return PKOL.filter(x=>!s[x[0]]).map(x=>x[0])}
/* Tombol Lengkapi: buka Data Siswa, gulir ke kolom kosong, kotak berkedip 5 detik */
let KD=0;
function lengkapi(){KD=1;go('siswa')}
function kedipKosong(){if(!KD)return;KD=0;
 const rows=profilKosong(S.siswa).map(k=>$('.row[data-f="'+k+'"]')).filter(Boolean);if(!rows.length)return;
 setTimeout(()=>{rows[0].scrollIntoView({behavior:'smooth',block:'center'});rows.forEach(r=>r.classList.add('kd'));setTimeout(()=>rows.forEach(r=>r.classList.remove('kd')),5000)},380)}
function profilNotif(s){const k=profilKurang(s);if(!k.length)return '';
 return '<div class="panel ct pk" role="alert"><div class="pb" style="padding-top:14px"><div class="pkt">⚠️ Profil anak belum lengkap</div><div class="mu">Belum diisi: '+esc(k.join(', '))+'.</div><button type="button" class="btn fx" onclick="lengkapi()">Lengkapi</button></div></div>'}
R.dashboard=d=>{const s=d.siswa,k=d.sekolah,a=d.absen_hari_ini,tb=d.tabungan;
 return profilNotif(s)+'<div class="panel ct"><div class="pb" style="padding-top:14px"><div class="sch">'+esc(k.nama)+'</div><div class="mu">'+(s.kelas?'Kelas '+esc(s.kelas):'&nbsp;')+'</div></div></div>'+
 '<div class="panel ct"><div class="ph">📅 Absensi Hari Ini</div><div class="pb">'+(a?'<div class="big">'+badge(a)+'<div class="mu">'+(jam(a.jam)?'Jam '+jam(a.jam):'')+(a.catatan?(jam(a.jam)?' · ':'')+esc(a.catatan):'')+'</div></div>':'<div class="mu">Belum ada data absensi hari ini.</div>')+lapForm(d)+'</div></div>'+
 (tb.aktif?'<div class="panel ct"><div class="ph">💰 Tabungan Hari Ini</div><div class="pb"><div class="mu">Saldo saat ini</div><div class="saldo">'+rp(tb.saldo)+'</div>'+(tb.hari_ini.length?tb.hari_ini.map(trx).join(''):'<div class="mu">Tidak ada transaksi hari ini.</div>')+'</div></div>':'')+
 calPanel(d)};
const SAP={hadir:'Selamat beraktivitas 😊',alpa:'Semangat yah sekolahnya 💪',terlambat:'Belajar disiplin lagi yah, semangat terus 🙂',sakit:'Semoga cepat sembuh dan bisa beraktivitas kembali 🤒',izin:'Semoga dilancarkan segala urusannya 🤲',libur:'Selamat menikmati momen bersama keluarga, sampai jumpa kembali 👨‍👩‍👧'};
function sapa(d){const a=d.absen_hari_ini,k=a?a.status:(d.libur.some(x=>x.tanggal===d.hari_ini)?'libur':'');$('#gt').textContent=SAP[k]||'Semoga harimu menyenangkan 🌤️'}

/* A2. Lapor izin / sakit hari ini */
const LW={izin:'#1673bd',sakit:'#d83d4d'};
function lapForm(d){const a=d.absen_hari_ini;
 if(d.libur.some(x=>x.tanggal===d.hari_ini)||(a&&(a.status==='hadir'||a.status==='terlambat')))return '';
 const ada=!!a&&(a.status==='izin'||a.status==='sakit');LAP.st=ada?a.status:'';
 const ket=ada?String(a.catatan||'').replace(/\s*\|\s*sakit otomatis.*$/i,''):'';
 return '<div class="lap"><div class="lt">'+(ada?'Ubah laporan hari ini':'Anak tidak masuk hari ini?')+'</div><div class="pil">'+
  ['izin','sakit'].map(x=>'<button type="button" class="fx '+x+(LAP.st===x?' on':'')+'" data-s="'+x+'" onclick="lapPilih(\''+x+'\')">'+(x==='izin'?'📝 Izin':'🤒 Sakit')+'</button>').join('')+'</div>'+
  '<div class="kr" data-s="'+LAP.st+'"><textarea id="lapk" rows="2" maxlength="200" placeholder="Keterangan (opsional)">'+esc(ket)+'</textarea><button type="button" class="btn fx" id="lapkirim" onclick="lapKirim()"'+(LAP.st?'':' disabled')+'>'+(ada?'Perbarui':'Kirim')+'</button></div></div>'}
function lapPilih(s){LAP.st=s;document.querySelectorAll('.pil button').forEach(x=>x.classList.toggle('on',x.dataset.s===s));$('.kr').dataset.s=s;$('#lapkirim').disabled=false}

/* Notifikasi (toast) dan kotak konfirmasi buatan sendiri */
let tT;
function toast(t,tp){const e=$('#toast');tp=tp||'ok';e.className='toast '+tp;e.textContent=(tp==='err'?'⚠️ ':tp==='info'?'⏳ ':'✅ ')+t;void e.offsetWidth;e.classList.add('on');clearTimeout(tT);if(tp!=='info')tT=setTimeout(()=>e.classList.remove('on'),tp==='err'?5000:3500)}
function konfirm(o){return new Promise(ok=>{const ov=$('#ov');
 ov.innerHTML='<div class="dlg" role="dialog" aria-modal="true"><div class="di">'+o.ikon+'</div><h3>'+esc(o.judul)+'</h3><p>'+esc(o.isi)+'</p><div class="da"><button type="button" class="bt fx">Batal</button><button type="button" class="ya fx" style="background:'+o.warna+'">'+esc(o.ya)+'</button></div></div>';
 const tutup=v=>{ov.classList.remove('on');document.removeEventListener('keydown',kd);setTimeout(()=>{ov.innerHTML=''},220);ok(v)},kd=e=>{if(e.key==='Escape')tutup(false)};
 ov.onclick=e=>{if(e.target===ov)tutup(false)};ov.querySelector('.bt').onclick=()=>tutup(false);const y=ov.querySelector('.ya');y.onclick=()=>tutup(true);
 document.addEventListener('keydown',kd);ov.classList.add('on');y.focus()})}

/* Animasi amplop: terbuka, dokumen masuk, tertutup; sukses jadi pesawat kertas terbang, gagal tetap + tanda X */
const slp=ms=>new Promise(r=>setTimeout(r,ms)),RM=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
function ampBuka(st){const o=$('#eo');
 o.style.setProperty('--ec',LW[st]);
 o.innerHTML='<div class="ea"><div class="est"><div class="eenv"><div class="ew"><div class="eb"></div><div class="efl"></div><div class="ep"><div class="ebar"></div><div class="eln"></div><div class="eln" style="width:70%"></div><div class="eln"></div><div class="eln" style="width:50%"></div></div><div class="efr"></div></div></div>'+
  '<div class="epl"><div class="epa"></div><div class="eps"></div></div>'+
  '<div class="eres"><svg class="ec" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg><svg class="ex" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></div></div>'+
  '<div class="emsg">Mengirim laporan…</div><div class="esub"></div><div class="eact"><button type="button" class="ery fx">Coba lagi</button><button type="button" class="ect fx">Tutup</button></div></div>';
 void o.offsetWidth;o.classList.add('on');return o}
function ampTutup(o){o.classList.remove('on');setTimeout(()=>{if(!o.classList.contains('on'))o.innerHTML=''},260)}
async function ampSiap(o){const q=s=>o.querySelector(s);
 if(RM){q('.eenv').classList.add('in');q('.ep').classList.add('in');q('.efl').classList.add('cl');return slp(300)}
 await slp(40);q('.eenv').classList.add('in');await slp(280);
 q('.ep').classList.add('in');await slp(380);
 q('.efl').classList.add('cl');await slp(320);
 q('.ew').classList.add('wob')}
async function ampSukses(o,sub){const q=s=>o.querySelector(s);q('.ew').classList.remove('wob');
 if(!RM){q('.epl').classList.add('show');q('.eenv').classList.add('hide');await slp(70);
  q('.epl').classList.add('fold');await slp(480);
  q('.epl').classList.add('fly');await slp(700)}
 else q('.eenv').classList.add('hide');
 q('.eres').classList.add('ok');q('.emsg').textContent='Laporan terkirim';q('.esub').textContent=sub;await slp(1100)}
function ampGagal(o,pesan,ulang){const q=s=>o.querySelector(s);q('.ew').classList.remove('wob');
 q('.ew').classList.add('bad','shk');q('.eres').classList.add('bad');
 q('.emsg').textContent='Gagal terkirim';q('.esub').textContent=pesan;
 q('.eact').style.display='flex';if(!ulang)q('.ery').style.display='none';
 return new Promise(res=>{q('.ery').onclick=()=>res('ulang');q('.ect').onclick=()=>res('tutup');q('.ect').focus()})}

async function lapKirim(){if(!LAP.st||LAP.busy)return;
 const st=LAP.st,b=$('#lapkirim'),nm=S.siswa.pan||S.siswa.nama;
 if(!await konfirm({ikon:st==='izin'?'📝':'🤒',judul:'Kirim laporan '+st+'?',isi:'Laporan '+st+' hari ini untuk '+nm+' akan dikirim ke sekolah.',ya:'Kirim',warna:LW[st]}))return;
 LAP.busy=1;b.disabled=true;
 for(;;){
  const o=ampBuka(st),cat=($('#lapk').value||'').trim();
  const pr=fetch('/api/portal',{method:'POST',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({k:m[1],status:st,catatan:cat})})
   .then(async r=>({r,j:await r.json().catch(()=>({}))})).catch(()=>null);
  await ampSiap(o);
  const x=await pr;
  if(x&&x.r.ok){await ampSukses(o,'Laporan '+st+' untuk '+nm+' sudah diterima sekolah.');ampTutup(o);delete C.dashboard;delete C.absensi;LAP.busy=0;return go('dashboard')}
  const k=!!x&&x.r.status===409;
  const pesan=!x?'Periksa koneksi internet, lalu coba lagi.':(x.j.error||(k?'Laporan tidak dapat diubah.':'Gagal mengirim, coba lagi.'));
  const a=await ampGagal(o,pesan,!k);
  if(a==='ulang')continue;
  ampTutup(o);
  if(k){delete C.dashboard;delete C.absensi;LAP.busy=0;return go('dashboard')}
  LAP.busy=0;b.disabled=false;return}}

/* B1. Data Siswa */
function kartu(){const s=S.siswa,k=S.sekolah;return Kartu.buatKartu({nama:s.nama,nisn:s.nisn,kelas:s.kelas,tgl:s.tgl,jk:s.jk,alamat:s.alamat,wa:s.wa,masuk:s.masuk},{nama:k.nama,tahun:k.tahun_ajaran,hari:S.hari,qr:Kartu.urlQR(s.kode_qr)})}
R.siswa=d=>{const s=d.siswa,wa=s.wa?'0'+String(s.wa).replace(/^62/,''):'-';
 return '<div class="panel"><div class="hero c"><h2>'+esc(s.nama)+'</h2>'+(s.kelas?'<p>'+esc(s.kelas)+'</p>':'')+'</div></div>'+
 '<div class="panel"><div class="ph">🪪 Kartu Anak</div><div class="pb"><img class="kimg" id="kimg" alt="Kartu anak"><button class="btn fx" onclick="unduh()">⬇ Unduh kartu</button></div></div>'+
 '<div class="panel"><div class="ph">👤 Profil</div><div class="pb">'+
 [['Nama lengkap',s.nama],['Nama panggilan',s.pan||'-','pan'],['Kelas',s.kelas||'-'],['NISN',s.nisn||'-'],['Tanggal lahir',s.tgl?tgl(s.tgl):'-','tgl'],['Jenis kelamin',s.jk==='L'?'Laki-laki':s.jk==='P'?'Perempuan':'-','jk'],['Alamat',s.alamat||'-','alamat'],['WA orang tua',wa,'wa'],['Tahun masuk',s.masuk||'-']].map(x=>'<div class="row"'+(x[2]?' data-f="'+x[2]+'"':'')+'><span>'+x[0]+'</span><b>'+esc(x[1])+'</b></div>').join('')+'</div></div>'+
 '<div class="panel"><div class="pb" style="padding-top:14px"><button type="button" class="btn fx" style="margin-top:0" onclick="profilBuka()">✏️ Ubah profil</button><div class="mu" style="margin-top:8px;text-align:center">Kelas, NISN, dan tahun masuk hanya dapat diubah oleh sekolah.</div></div></div>'};
A.siswa=()=>{try{$('#kimg').src=kartu()}catch(e){const p=$('#kimg');if(p)p.closest('.panel').remove()}kedipKosong()};
function unduh(){const a=document.createElement('a');a.href=$('#kimg').src;a.download='kartu-'+S.siswa.nama.replace(/[^\w]+/g,'-')+'.png';document.body.appendChild(a);a.click();a.remove()}

/* Ubah profil oleh orang tua (kecuali kelas, NISN, tahun masuk) */
const PF={busy:0},normWA=n=>{let d=String(n||'').replace(/\D/g,'');if(d[0]==='0')d='62'+d.slice(1);else if(d[0]==='8')d='62'+d;return d},waLokal=w=>w?'0'+String(w).replace(/^62/,''):'';
function profilBuka(){const s=S.siswa,o=$('#fo');
 const f=(id,l,v,x)=>'<label for="'+id+'">'+l+'</label><input id="'+id+'" value="'+esc(v)+'" '+(x||'')+'>',ro=(l,v)=>'<label>'+l+'</label><input disabled value="'+esc(v||'-')+'">';
 o.innerHTML='<div class="fd" role="dialog" aria-modal="true"><h3>✏️ Ubah profil</h3><p class="fs">Perbarui data anak Anda. Kelas, NISN, dan tahun masuk hanya dapat diubah oleh sekolah.</p>'+
  f('fnm','Nama lengkap',s.nama,'maxlength="100" autocomplete="off"')+f('fpn','Nama panggilan',s.pan,'maxlength="30" autocomplete="off"')+
  f('ftg','Tanggal lahir (opsional)',s.tgl,'type="date" min="1990-01-01" max="'+esc(S.hari)+'"')+
  '<label for="fjk">Jenis kelamin</label><select id="fjk"><option value="">-</option><option value="L"'+(s.jk==='L'?' selected':'')+'>Laki-laki</option><option value="P"'+(s.jk==='P'?' selected':'')+'>Perempuan</option></select>'+
  f('fal','Alamat (opsional)',s.alamat,'maxlength="200" autocomplete="off"')+
  f('fwa','WhatsApp orang tua',waLokal(s.wa),'type="tel" inputmode="numeric" maxlength="16" placeholder="081234567890"')+
  ro('Kelas',s.kelas)+ro('NISN',s.nisn)+ro('Tahun masuk',s.masuk)+
  '<div class="fe" id="ffe" role="alert"></div><div class="fa"><button type="button" class="bt fx" id="fbt">Batal</button><button type="button" class="ya fx" id="fya">Simpan</button></div></div>';
 o.onclick=e=>{if(e.target===o&&!PF.busy)profilTutup()};$('#fbt').onclick=()=>{if(!PF.busy)profilTutup()};$('#fya').onclick=profilSimpan;

function profilTutup(){const o=$('#fo');o.classList.remove('on');setTimeout(()=>{if(!o.classList.contains('on'))o.innerHTML=''},260)}
async function profilSimpan(){if(PF.busy)return;const s=S.siswa,fe=$('#ffe'),y=$('#fya'),bt=$('#fbt'),v=id=>$('#'+id).value.trim().replace(/\s+/g,' ');
 const nama=v('fnm'),pan=v('fpn'),tg=$('#ftg').value,jk=$('#fjk').value,alamat=v('fal'),raw=$('#fwa').value.trim(),wa=raw?normWA(raw):'',lama=String(s.wa||'');
 fe.textContent='';const salah=t=>{fe.textContent=t};
 if(nama.length<2)return salah('Nama lengkap wajib diisi');
 if(!pan)return salah('Nama panggilan wajib diisi');
 if(tg&&(tg<'1990-01-01'||tg>S.hari))return salah('Tanggal lahir tidak valid');
 if(raw&&!/^62\d{8,13}$/.test(wa))return salah('Nomor WhatsApp tidak valid. Contoh: 081234567890');
 if(!wa&&lama)return salah('Nomor WhatsApp tidak boleh dikosongkan');
 if(wa!==lama&&!await konfirm({ikon:'⚠️',judul:'Ganti nomor WhatsApp?',isi:'Nomor '+waLokal(wa)+' harus terdaftar di grup WhatsApp sekolah supaya izin lewat WhatsApp tetap bisa dilakukan. Pastikan nomor ini sudah terdaftar sebelum menyimpan.',ya:'Ya, simpan',warna:'#d99a27'}))return;
 PF.busy=1;y.disabled=true;bt.disabled=true;y.textContent='Menyimpan…';
 try{const r=await fetch('/api/portal',{method:'PATCH',headers:{'Content-Type':'application/json'},cache:'no-store',body:JSON.stringify({k:m[1],nama,pan,tgl:tg,jk,alamat,wa})}),j=await r.json().catch(()=>({}));
  if(!r.ok){salah(j.error||'Gagal menyimpan, coba lagi.');return}
  Object.assign(S.siswa,j.siswa);Object.keys(C).forEach(k=>delete C[k]);profilTutup();toast('Profil sudah diperbarui','ok');go('siswa')}
 catch(e){salah('Gagal menyimpan. Periksa koneksi internet lalu coba lagi.')}
 finally{PF.busy=0;y.disabled=false;bt.disabled=false;y.textContent='Simpan'}}

R.tabungan=d=>{const tb=d.tabungan;if(!tb.aktif)return '<div class="msg"><div style="font-size:44px">💰</div><h2>Tabungan tidak aktif</h2><div class="mu">Sekolah belum mengaktifkan fitur tabungan.</div></div>';

/* B4. Kalender Hari Libur */
const calPanel=d=>{const y=+d.hari_ini.slice(0,4),op=[];
 for(let yy=y-1;yy<=y+1;yy++)for(let mm=0;mm<12;mm++)op.push({v:yy+'-'+String(mm+1).padStart(2,'0'),t:BLN[mm]+' '+yy});
 return '<div class="panel ct"><div class="ph">🗓️ Kalender Hari Libur</div><div class="pb">'+dd('cal',op,d.hari_ini.slice(0,7),calRender)+'<div id="cal"></div></div></div>'};
R.libur=d=>calPanel(d);
A.libur=A.dashboard=()=>calRender(DD.cal.val);
function calRender(ym){const d={libur:S.libur,hari_ini:S.hari},p=ym.split('-'),y=+p[0],mo=+p[1]-1,first=new Date(y,mo,1).getDay(),len=new Date(y,mo+1,0).getDate(),lib={};
 d.libur.forEach(x=>lib[x.tanggal]=x);
 let h=HR.map(x=>'<div class="h">'+x+'</div>').join('')+'<div class="d e"></div>'.repeat(first),dl=[];
 for(let i=1;i<=len;i++){const k=ym+'-'+String(i).padStart(2,'0'),dow=(first+i-1)%7;if(lib[k]&&lib[k].jenis!=='mingguan')dl.push([k,lib[k].ket]);

 (dl.length?'<div style="margin-top:6px">'+dl.map(x=>'<div class="lr"><i></i><b>'+hari(x[0])+', '+tgl(x[0]).replace(/ (\w{3})\w*/,' $1')+'</b><span>'+esc(x[1])+'</span></div>').join('')+'</div>':'<div class="mu" style="margin-top:8px;text-align:left">Tidak ada hari libur bulan ini.</div>')}
