function tema(){

 const pr=h>=6&&h<18?(h-6)/12:((h>=18?h-18:h+6)/12);
 const sc=$('#scene');sc.style.background='linear-gradient('+t.sk[0]+','+t.sk[1]+' 46%)';
 const sn=$('#sn');sn.style.left='calc('+(8+pr*84)+'% - 22px)';sn.style.top=(41-Math.sin(Math.PI*pr)*34)+'%';sn.style.background=t.sun;sn.style.boxShadow='0 0 0 14px '+t.sun+'55';
 $('#se').style.background='linear-gradient('+t.sea[0]+','+t.sea[1]+')';$('#sd').style.background='linear-gradient('+t.sand[0]+','+t.sand[1]+')';

 Object.keys(V).forEach(x=>document.documentElement.style.setProperty('--'+x,V[x]));hdTema(k);}
