<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Absensi PAUD</title>
<style>
:root{--bg:#f4f8f7;--card:#fff;--ink:#16302f;--mute:#5d7472;--line:#d7e3e1;--main:#0f5c63;--h:#1f8a5b;--i:#2d6cc0;--s:#c07a12;--a:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#0f1c1c;--card:#172a29;--ink:#e6f1ef;--mute:#93aeab;--line:#2a4341;--main:#4fb3bd}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
.wrap{max-width:560px;margin:0 auto;padding:12px}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
h1{font-size:20px;margin:0}
h2{font-size:17px;margin:0 0 10px}
.tabs{display:flex;gap:6px;margin:6px 0 12px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:15px}
.tabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
input,select{width:100%;padding:11px;margin:4px 0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:16px}
label{font-size:14px;color:var(--mute)}
.btn{background:var(--main);color:#fff;border:0;padding:12px 16px;border-radius:10px;font-size:16px;width:100%}
.link{background:none;border:0;color:var(--main);padding:6px;font-size:14px;text-decoration:underline}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.nm{font-weight:600}.sub{font-size:13px;color:var(--mute)}
.st{display:flex;gap:5px}
.st button{width:40px;height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:700}
.st button.on[data-s=hadir]{background:var(--h);border-color:var(--h);color:#fff}
.st button.on[data-s=izin]{background:var(--i);border-color:var(--i);color:#fff}
.st button.on[data-s=sakit]{background:var(--s);border-color:var(--s);color:#fff}
.st button.on[data-s=alpa]{background:var(--a);border-color:var(--a);color:#fff}
.sum{display:flex;gap:8px;flex-wrap:wrap;font-size:14px;margin:6px 0 10px}
.sum span{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:3px 10px}
#toast{position:fixed;left:12px;right:12px;bottom:16px;background:#16302f;color:#fff;padding:12px;border-radius:10px;display:none;text-align:center;max-width:536px;margin:0 auto}
.x{color:var(--a);background:none;border:0;font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hariIni = () => new Date().toLocaleDateString('sv-SE', {timeZone:'Asia/Jakarta'});
let db, kelas = [], siswa = [], absen = {}, tgl = hariIni(), tab = 'absen', filterKelas = '';

function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3500)}
function view(html){$('app').innerHTML = html}

async function init(){
  const u = localStorage.getItem('sb_url'), k = localStorage.getItem('sb_key');
  if(!u || !k) return setupView();
  db = supabase.createClient(u, k);
  const {data:{session}} = await db.auth.getSession();
  session ? main() : loginView();
}

function setupView(){
  view(`<div class="box"><h1>Sambungkan ke database</h1>
  <p class="sub">Isi sekali saja di HP ini. Data ada di Supabase: Project Settings, lalu API.</p>
  <label>Project URL</label><input id="u" placeholder="https://xxxx.supabase.co">
  <label>Publishable key (anon key)</label><input id="k">
  <button class="btn" onclick="simpanSetup()">Simpan</button></div>`);
}
function simpanSetup(){
  const u=$('u').value.trim(), k=$('k').value.trim();
  if(!u.startsWith('https://')||!k) return toast('Isi URL dan key dengan benar');
  localStorage.setItem('sb_url',u); localStorage.setItem('sb_key',k); init();
}

function loginView(){
  view(`<div class="box"><h1>Absensi PAUD</h1><p class="sub">Masuk sebagai guru</p>
  <label>Email</label><input id="em" type="email" autocomplete="username">
  <label>Password</label><input id="pw" type="password" autocomplete="current-password">
  <button class="btn" onclick="masuk()">Masuk</button>
  <button class="link" onclick="localStorage.clear();setupView()">Ubah koneksi database</button></div>`);
}
async function masuk(){
  const {error} = await db.auth.signInWithPassword({email:$('em').value.trim(), password:$('pw').value});
  error ? toast('Gagal masuk: '+error.message) : main();
}
async function keluar(){ await db.auth.signOut(); loginView(); }

async function main(){
  view('<p class="sub">Memuat data...</p>');
  const [k, s] = await Promise.all([
    db.from('kelas').select('*').eq('aktif',true).order('id'),
    db.from('siswa').select('*, siswa_wali(wali(no_wa))').eq('aktif',true).order('nama')
  ]);
  if(k.error || s.error) return toast('Gagal memuat: '+(k.error||s.error).message);
  kelas = k.data; siswa = s.data;
  await muatAbsen();
  render();
}
async function muatAbsen(){
  const {data,error} = await db.from('absensi').select('*').eq('tanggal', tgl);
  if(error) return toast('Gagal memuat absen: '+error.message);
  absen = {}; data.forEach(r => absen[r.siswa_id] = r);
}

function render(){
  view(`<header><h1>Absensi PAUD</h1><button class="link" onclick="keluar()">Keluar</button></header>
  <div class="tabs"><button class="${tab=='absen'?'on':''}" onclick="tab='absen';render()">Absen</button>
  <button class="${tab=='siswa'?'on':''}" onclick="tab='siswa';render()">Siswa</button></div>
  ${tab=='absen' ? absenHTML() : siswaHTML()}`);
}

function absenHTML(){
  const list = siswa.filter(s => !filterKelas || s.kelas_id == filterKelas);
  const c = {hadir:0,izin:0,sakit:0,alpa:0,belum:0};
  list.forEach(s => absen[s.id] ? c[absen[s.id].status]++ : c.belum++);
  const rows = list.map(s => {
    const a = absen[s.id], st = a ? a.status : '';
    const info = a ? [a.cara, a.jam_datang ? new Date(a.jam_datang).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Jakarta'}) : '', a.catatan].filter(Boolean).join(' - ') : 'belum absen';
    const b = (k,l) => `<button data-s="${k}" class="${st==k?'on':''}" onclick="setStatus(${s.id},'${k}')">${l}</button>`;
    return `<div class="row"><div><div class="nm">${esc(s.nama_panggilan)}</div><div class="sub">${esc(s.nama)}<br>${esc(info)}</div></div>
    <div class="st">${b('hadir','H')}${b('izin','I')}${b('sakit','S')}${b('alpa','A')}</div></div>`;
  }).join('') || '<p class="sub">Belum ada siswa. Tambahkan di tab Siswa.</p>';
  return `<div class="box"><label>Tanggal</label><input type="date" value="${tgl}" onchange="tgl=this.value;muatAbsen().then(render)">
  <label>Kelas</label><select onchange="filterKelas=this.value;render()"><option value="">Semua kelas</option>
  ${kelas.map(k=>`<option value="${k.id}" ${filterKelas==k.id?'selected':''}>${esc(k.nama)}</option>`).join('')}</select>
  <div class="sum"><span>Hadir ${c.hadir}</span><span>Izin ${c.izin}</span><span>Sakit ${c.sakit}</span><span>Alpa ${c.alpa}</span><span>Belum ${c.belum}</span></div>
  <p class="sub" style="margin:0">H hadir, I izin, S sakit, A alpa</p></div>
  <div class="box">${rows}</div>`;
}

async function setStatus(id, st){
  let cat = absen[id]?.catatan || null;
  if(st !== 'hadir'){ cat = prompt('Catatan (boleh kosong)', cat || ''); if(cat === null) return; }
  const row = {siswa_id:id, tanggal:tgl, status:st, cara:'manual', catatan:cat||null, diubah:new Date().toISOString(),
    jam_datang: st=='hadir' ? (absen[id]?.jam_datang || new Date().toISOString()) : null};
  const {error} = await db.from('absensi').upsert(row, {onConflict:'siswa_id,tanggal'});
  if(error) return toast('Gagal menyimpan: '+error.message);
  absen[id] = row; render();
}

function siswaHTML(){
  const rows = siswa.map(s => {
    const k = kelas.find(x => x.id == s.kelas_id);
    const wa = (s.siswa_wali||[]).map(w => w.wali?.no_wa).filter(Boolean).join(', ');
    return `<div class="row"><div><div class="nm">${esc(s.nama_panggilan)}</div><div class="sub">${esc(s.nama)} - ${esc(k?k.nama:'tanpa kelas')}<br>${esc(wa||'nomor WA belum diisi')}</div></div>
    <button class="x" onclick="hapusSiswa(${s.id})">Nonaktifkan</button></div>`;
  }).join('') || '<p class="sub">Belum ada siswa.</p>';
  return `<div class="box"><h2>Tambah siswa</h2>
  <label>Nama lengkap</label><input id="sn"><label>Nama panggilan</label><input id="sp">
  <label>Kelas</label><select id="sk">${kelas.map(k=>`<option value="${k.id}">${esc(k.nama)}</option>`).join('')}</select>
  <label>Nomor WhatsApp orang tua (contoh 08123456789)</label><input id="sw" type="tel">
  <button class="btn" onclick="tambahSiswa()">Simpan siswa</button></div>
  <div class="box"><h2>Daftar siswa (${siswa.length})</h2>${rows}</div>`;
}

function normWA(n){
  let d = String(n||'').replace(/\D/g,'');
  if(d.startsWith('0')) d = '62'+d.slice(1);
  else if(d.startsWith('8')) d = '62'+d;
  return d;
}

async function tambahSiswa(){
  const nama=$('sn').value.trim(), pan=$('sp').value.trim(), kid=$('sk').value, wa=normWA($('sw').value);
  if(!nama||!pan) return toast('Nama lengkap dan panggilan wajib diisi');
  const {data:s, error} = await db.from('siswa').insert({nama, nama_panggilan:pan, kelas_id:kid||null}).select().single();
  if(error) return toast('Gagal menyimpan: '+error.message);
  if(wa){
    const w = await db.from('wali').upsert({no_wa:wa}, {onConflict:'no_wa'}).select().single();
    if(w.error) toast('Siswa tersimpan, nomor WA gagal: '+w.error.message);
    else await db.from('siswa_wali').insert({siswa_id:s.id, wali_id:w.data.id});
  }
  toast('Siswa tersimpan'); main();
}

async function hapusSiswa(id){
  if(!confirm('Nonaktifkan siswa ini? Riwayat absen tetap tersimpan.')) return;
  const {error} = await db.from('siswa').update({aktif:false}).eq('id', id);
  error ? toast('Gagal: '+error.message) : main();
}

init();
</script>
</body>
</html>
