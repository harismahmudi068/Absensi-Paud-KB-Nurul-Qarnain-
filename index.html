       const was=waliRows.length?await dbq(db.from('wali').select('id,no_wa').in('no_wa',[...new Set(waliRows.map(x=>x.no_wa))])):[];
       const wid=new Map(was.map(w=>[w.no_wa,w.id]));
       const rel=[];for(const z of chunk){const n=byKey.get(String(z.data.nama).toLowerCase()+'|'+z.data.kelas_id);if(!n)throw new Error('Data siswa hasil insert tidak ditemukan');if(z.data.wa)rel.push({siswa_id:n.id,wali_id:wid.get(z.data.wa)});}
       if(rel.length)await dbq(db.from('siswa_wali').insert(rel));
       ok+=chunk.length;
     }catch(e){
       for(const z of chunk){const n=byKey.get(String(z.data.nama).toLowerCase()+'|'+z.data.kelas_id);if(!n){fail(z.row,z.r,e);continue}try{if(z.data.wa)await setWali(n.id,z.data.wa);ok++}catch(err){fail(z.row,z.r,err)}}
     }
   }
   await muatDasar();
 }
 renderV();info('Hasil impor','<div class="note">✅ Berhasil: <b>'+ok+'</b> data<br>❌ Gagal: <b>'+gagal.length+'</b> data</div>'+(gagal.length?'<div class="mu">'+gagal.map(esc).join('<br>')+'</div>':''))
})}

function panelKoneksi(){const R=RHS||{};
 const st=(o,f)=>o&&o.ada?`<span class="badge Hadir">Terisi ${esc(o.tampil||'')}</span> <button class="btn sm soft" onclick="hapusRahasia('${f}')">Hapus</button>`:'<span class="badge Belum">Belum diisi</span>';

 return `<div class="panel"><div class="ph">🔌 Koneksi WhatsApp dan AI</div><div class="pb"><div class="note">Data ini dipakai sekolah Anda untuk membaca dan membalas pesan wali. Kunci dan token tidak ditampilkan lagi setelah disimpan. Kosongkan kolomnya bila tidak ingin mengganti.</div>${err}
<div class="fg"><div class="fd"><label class="l">Kunci API AI (Gemini) ${st(R.kunci_ai,'kunci_ai')}</label><input id="rhAI" class="input" type="password" autocomplete="off" placeholder="Tempel kunci baru di sini"></div>

<button class="btn success" onclick="simpanKoneksi(this)">💾 Simpan koneksi</button></div></div>
<div class="panel"><div class="ph">🔗 Alamat Webhook</div><div class="pb"><div class="note">Pasang alamat ini di pengaturan Webhook Fonnte untuk sekolah Anda. Alamatnya rahasia dan unik untuk sekolah Anda, jadi disembunyikan. Untuk melihatnya, masukkan kata sandi akun Anda.</div><div class="tb"><button class="btn success" onclick="mintaWebhook(false)">🔓 Tampilkan alamat</button><button class="btn danger" onclick="mintaWebhook(true)">♻ Buat ulang kunci</button></div></div></div>`}
function simpanKoneksi(btn){const ai=$('#rhAI').value.trim(),ft=$('#rhFT').value.trim(),gr=$('#rhGR').value.trim(),nk=$('#rhNK').value.trim();
 const b={aksi:'simpan',id_grup:gr,nomor_kepala:nk};if(ai)b.kunci_ai=ai;if(ft)b.token_fonnte=ft;
 if(btn)btn.disabled=true;guard(async()=>{try{await apiPengaturan(b);await muatRahasia();toast('Koneksi disimpan');renderV()}finally{if(btn)btn.disabled=false}})}

 if(baru&&!await konfirmasi('Kunci lama langsung berhenti berlaku. Alamat baru harus dipasang ulang di Fonnte. Lanjutkan?',{judul:'Buat ulang kunci',ya:'Buat ulang',bahaya:1}))return;

async function simpanNamaSekolah(btn){const v=String($('#nsInp').value||'').replace(/\s+/g,' ').trim();
 if(!v)return toast('Nama sekolah wajib diisi',false);if(v===ns())return toast('Nama sekolah belum berubah',false);
 if(btn)btn.disabled=true;ld(1,'Menyimpan nama sekolah...');

 catch(e){ld(0);if(btn)btn.disabled=false;const m=(e&&e.message)||String(e);toast(/nama_sekolah/.test(m)&&!/tidak tersimpan/.test(m)?'Kolom nama_sekolah belum ada di tabel pengaturan. Jalankan SQL penambahan kolom di Supabase terlebih dahulu':m,false)}}

async function runChecks(){const R=[],add=(l,n,d)=>R.push([l,n,d]),as=act(),nama=a=>a.map(s=>s.pan).join(', ');
 let t0=performance.now();try{await dbq(db.from('pengaturan').select('id').limit(1));add('ok','Koneksi Supabase','Tersambung ('+Math.round(performance.now()-t0)+' ms)')}catch(e){add('err','Koneksi Supabase',e.message)}
 add('ok','Sesi login',meNama+' ('+role+')');
 for(const t of ['kelas','siswa','wali','siswa_wali','absensi','profil','pengaturan','libur_mingguan','libur_tanggal','laporan_ortu','pesan_masuk','percakapan_tertunda']){try{const r=await db.from(t).select('*',{count:'exact',head:true});if(r.error)throw r.error;add('ok','Tabel '+t,r.count+' baris')}catch(e){add('err','Tabel '+t,e.message)}}
 for(const [n,u,k] of [['Webhook Fonnte','/api/webhook','aktif'],['API guru','/api/guru','aktif']]){try{const t=await (await fetch(u)).text();add(t.toLowerCase().includes(k)?'ok':'warn',n,t.toLowerCase().includes(k)?'Aktif':'Tidak merespons dengan benar')}catch(e){add('err',n,'Tidak bisa dihubungi')}}
 const sec=location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname),cam=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);add(sec&&cam?'ok':'warn','Kamera untuk scan',sec&&cam?'HTTPS dan kamera tersedia':'Kamera butuh HTTPS dan browser yang mendukung');
 add(typeof XLSX!=='undefined'&&typeof ExcelJS!=='undefined'&&window.jspdf&&window.Html5Qrcode&&window.qrcode?'ok':'warn','Pustaka XLSX, PDF, QR',typeof XLSX!=='undefined'&&typeof ExcelJS!=='undefined'&&window.jspdf&&window.Html5Qrcode&&window.qrcode?'Semua termuat':'Ada yang belum termuat (butuh internet)');
 const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;add(/Jakarta|Makassar|Jayapura|Pontianak/.test(tz)?'ok':'warn','Zona waktu perangkat',tz);
 const bk=as.filter(s=>!S.kelas.some(k=>k.nama===s.kelas));add(bk.length?'err':'ok','Kelas siswa',bk.length?'Kelas tidak dikenal: '+nama(bk):'Semua siswa aktif punya kelas');
 const nw=as.filter(s=>!s.wa);add(nw.length?'warn':'ok','Nomor WhatsApp orang tua',nw.length?nw.length+' anak belum punya nomor: '+nama(nw):'Semua siswa aktif punya nomor');
 const bf=as.filter(s=>s.wa&&!/^628\d{8,12}$/.test(s.wa));add(bf.length?'warn':'ok','Format nomor',bf.length?'Bukan format 628xxx: '+nama(bf):'Semua nomor berformat 628xxx');
 const g={};as.forEach(s=>{if(s.wa)(g[s.wa]=g[s.wa]||[]).push(s)});const kb=[];Object.values(g).forEach(a=>{const c={};a.forEach(s=>{const n=s.pan.toLowerCase();c[n]=(c[n]||0)+1});a.forEach(s=>{if(c[s.pan.toLowerCase()]>1)kb.push(s)})});add(kb.length?'err':'ok','Panggilan kembar dalam satu nomor',kb.length?'Balasan izin WhatsApp jadi ambigu: '+nama(kb):'Tidak ada');
 const ks=S.guru.filter(x=>x.role==='kepala_sekolah'&&x.aktif).length;add(ks?'ok':'err','Akun Kepala Sekolah',ks?ks+' akun aktif':'Tidak ada Kepala Sekolah aktif');
 add(S.mingguan.length?'ok':'info','Libur mingguan',S.mingguan.length?S.mingguan.map(d=>HR[d]).join(', '):'Belum ada hari libur mingguan');add('info','Alpa otomatis',S.set.alpa_aktif?'Aktif, jam '+S.set.jam:'Dimatikan');
 const bl=as.filter(s=>dayStat(s,TODAY)==='Belum');add('info','Absensi hari ini',bl.length?bl.length+' anak belum absen':'Semua sudah tercatat');
 return R}
