 const {error}=await db.auth.signInWithPassword({email,password:pw});if(error)throw new Error('Username atau kata sandi salah');await mulai()})}

 try{me=session.user.id;await muatDasar();const p=S.guru.find(g=>g.id===me);if(!p||!p.aktif){await db.auth.signOut();return loginView('Akun ini tidak terdaftar atau sudah dinonaktifkan')}
  role=LBL[p.role];meNama=p.nama;$('#lg').classList.add('hid');$('#ap').classList.remove('hid');$('#bn').classList.remove('hid');view='dashboard';await go('dashboard')}

async function apiGuru(body){const {data:{session}}=await db.auth.getSession();const r=await fetch('/api/guru',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Gagal ('+r.status+')');return j}
function editGuru(id){const g=S.guru.find(x=>x.id===id),mine=id===me;if(!kelola()&&!mine)return toast('Anda hanya bisa mengubah akun sendiri',false);
 form(mine?'Ubah profil saya':'Ubah '+g.nama,[{k:'nama',l:'Nama',v:g.nama},{k:'user',l:'Username',v:g.username},{k:'sandi',l:'Kata sandi baru (kosongkan bila tidak diganti)',t:'password'}],async v=>{

 await apiGuru({aksi:'tambah',nama:v.nama,username:v.user,sandi:v.sandi,role:KEYR[v.role]});await muatProfil();toast('Guru ditambahkan');renderV()})}

 return `<div class="panel"><div class="ph">☑ Absensi Manual</div><div class="pb"><div class="tb">${dt('date',attDate,"setAtt(this.value)")}<select class="select" onchange="attKelas=this.value;renderV()">${kopt(attKelas,1)}</select><button class="btn orange" onclick="markLibur()">🏖 Tandai libur</button></div>

 <div class="cards">${l.map((s,i)=>{const d=draft[s.id],cur=d?d.st:'';return `<div class="card sc c${i%4+1}"><div class="av">${ini(s.pan)}</div><div class="sn">${esc(s.pan)}</div><div class="sk">${esc(s.nama)} - ${esc(s.kelas)}${d&&d.cara!=='manual'?' - via '+esc(d.cara):''} ${cur==='Libur'?badge('Libur'):''}</div><div class="sb">${ST.map(x=>`<button data-s="${x}" class="${cur===x?'sel':''}" onclick="pick(${s.id},'${x}')">${x}</button>`).join('')}<button class="clr" ${cur?'':'disabled'} onclick="clr(${s.id})">Kosongkan</button></div></div>`}).join('')||'<div class="mu">Belum ada siswa.</div>'}</div></div></div>
 <div style="height:76px"></div><div class="save"><div><b>${isi} dari ${l.length} terisi</b><div class="mu">${l.length-isi} dikosongkan (bisa diisi orang tua lewat WhatsApp)</div></div><button class="btn success" onclick="saveAtt()">💾 Simpan Absensi</button></div>`};

 Object.keys(draft).forEach(id=>{const d=draft[id],b=before[id];if(!b||b.st!==d.st||b.cara!==d.cara||(b.cat||'')!==(d.cat||''))ups.push({siswa_id:+id,tanggal:attDate,status:low(d.st),cara:d.cara,catatan:d.cat||null,jam_datang:d.iso||null,diubah:now,diubah_oleh:me})});
 Object.keys(before).forEach(id=>{if(!draft[id])del.push(+id)});
 if(ups.length)await dbq(db.from('absensi').upsert(ups,{onConflict:'siswa_id,tanggal'}));
 if(del.length)await dbq(db.from('absensi').delete().eq('tanggal',attDate).in('siswa_id',del));

const histHTML=()=>{const h=Object.entries(A(TODAY)).filter(e=>e[1].cara==='scan').map(e=>({s:S.siswa.find(x=>x.id==e[0]),r:e[1]})).filter(x=>x.s).sort((a,b)=>(b.r.jam||'').localeCompare(a.r.jam||''));
 return `<div class="ph">🕘 Riwayat Scan Hari Ini <span class="mu">${fmt(TODAY)} - ${h.length} anak</span></div><div class="pb">${tab(['Jam','Anak','Kelas','Status'],h.map(x=>`<tr><td><b>${esc(x.r.jam||'-')}</b></td><td>${esc(x.s.pan)}<div class="mu">${esc(x.s.nama)}</div></td><td>${esc(x.s.kelas)}</td><td>${badge(x.r.st)}</td></tr>`).join(''))}</div>`};
V.scan=()=>`<div class="panel"><div class="ph">📷 Scan Kartu</div><div class="pb"><div id="reader"></div><div class="tb"><button class="btn success grow" id="bs" onclick="toggleScan()">Nyalakan kamera</button><button class="btn soft" onclick="balikKamera()">🔄 Balik kamera</button></div><div class="mu">Kamera aktif: <b id="camlbl">${cam}</b></div><div id="hasil" style="margin-top:10px;font-weight:700"></div></div></div><div class="panel" id="hist">${histHTML()}</div>`;
function hasil(m,ok){const h=$('#hasil');if(!h)return;h.textContent=m;h.style.color=ok?'var(--g)':'var(--rd)';if(navigator.vibrate)navigator.vibrate(ok?120:[80,60,80])}
async function mulaiScan(){if(scanner)await stopScan();scanner=new Html5Qrcode('reader');
 try{await scanner.start({facingMode:cam==='belakang'?'environment':'user'},{fps:10,qrbox:{width:220,height:220}},onScan,()=>{});$('#bs').textContent='Matikan kamera'}catch(e){scanner=null;toast('Kamera tidak bisa dibuka. Izinkan akses kamera untuk situs ini.',false)}}
async function stopScan(){if(!scanner)return;const s=scanner;scanner=null;try{await s.stop();s.clear()}catch(e){}const b=$('#bs');if(b)b.textContent='Nyalakan kamera'}
function toggleScan(){scanner?stopScan():mulaiScan()}
function balikKamera(){cam=cam==='belakang'?'depan':'belakang';const l=$('#camlbl');if(l)l.textContent=cam;if(scanner)mulaiScan()}
async function onScan(kode){const now=Date.now();if(busy||(kode===lastKode&&now-lastAt<4000))return;busy=true;lastKode=kode;lastAt=now;
 try{const s=S.siswa.find(x=>x.kode_qr===kode&&x.aktif);if(!s)return hasil('QR tidak dikenal atau siswa nonaktif.',false);
  const r=await dbq(db.from('absensi').select('*').eq('siswa_id',s.id).eq('tanggal',TODAY).maybeSingle()),ada=r?fromRow(r):null;
  if(!okLib(s.kelas,TODAY))return;
  if(ada&&(ada.st==='Hadir'||ada.st==='Terlambat'))return hasil(`${s.pan} sudah tercatat ${ada.st.toLowerCase()} jam ${ada.jam}.`,false);
  if(ada&&ada.cara!=='otomatis'&&!confirm(`${s.pan} tercatat ${ada.st}. Ubah menjadi hadir?`))return;
  const iso=new Date().toISOString(),jm=jamJkt(iso),lim=(S.kelas.find(k=>k.nama===s.kelas)||{jam:'23:59'}).jam,st=jm>lim?'Terlambat':'Hadir';
  await dbq(db.from('absensi').upsert({siswa_id:s.id,tanggal:TODAY,status:low(st),cara:'scan',catatan:ada&&ada.cara!=='otomatis'?ada.cat||null:null,jam_datang:iso,diubah:iso,diubah_oleh:me},{onConflict:'siswa_id,tanggal'}));
  (S.absen[TODAY]=S.absen[TODAY]||{})[s.id]={st,cara:'scan',cat:'',jam:jm,iso};hasil(`${s.pan} ${st.toLowerCase()}, jam ${jm}.`,true);const h=$('#hist');if(h)h.innerHTML=histHTML()}
 catch(e){hasil('Gagal: '+(e.message||e),false)}finally{busy=false}}
/* ---------- kartu ---------- */
function qrObj(kode){const o=qrcode(0,'M');o.addData(kode);o.make();return o}
function qrSvg(kode,px){const o=qrObj(kode),n=o.getModuleCount(),m=2;let r='';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(o.isDark(y,x))r+=`<rect x="${x+m}" y="${y+m}" width="1" height="1"/>`;return `<svg viewBox="0 0 ${n+m*2} ${n+m*2}" width="${px}" height="${px}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/>${r}</svg>`}
V.kartu=()=>`<div class="panel"><div class="ph">🪪 Kartu Siswa</div><div class="pb"><div class="tb"><select class="select" onchange="kk=this.value;renderV()">${kopt(kk,1)}</select><button class="btn success" onclick="unduhKartu()">Unduh kartu (PDF)</button></div><div class="cards">${act().filter(s=>!kk||s.kelas===kk).map(s=>`<div class="kc"><div><small class="mu">KB NURUL QARNAIN</small><b>${esc(s.pan)}</b><div class="mu">${esc(s.nama)}<br>Kelas: ${esc(s.kelas)}</div></div>${qrSvg(s.kode_qr,72)}</div>`).join('')}</div></div></div>`;
function gambarQR(doc,kode,x,y,size){const o=qrObj(kode),n=o.getModuleCount(),qz=2,cell=size/(n+qz*2);doc.setFillColor(255,255,255);doc.rect(x,y,size,size,'F');doc.setFillColor(0,0,0);for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(o.isDark(r,c))doc.rect(x+(c+qz)*cell,y+(r+qz)*cell,cell+0.03,cell+0.03,'F')}
function unduhKartu(){try{const list=act().filter(s=>!kk||s.kelas===kk);if(!list.length)return toast('Tidak ada siswa untuk dicetak',false);const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),W=90,H=50,mx=15,my=23;
 list.forEach((s,i)=>{if(i>0&&i%10===0)doc.addPage();const p=i%10,x=mx+(p%2)*W,y=my+Math.floor(p/2)*H;doc.setDrawColor(15,92,99);doc.setLineWidth(0.4);doc.rect(x+1,y+1,W-2,H-2);
  doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(15,92,99);doc.text('KB NURUL QARNAIN',x+5,y+8);doc.setFontSize(15);doc.setTextColor(0,0,0);doc.text(doc.splitTextToSize(s.pan,40),x+5,y+20);
  doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.text(doc.splitTextToSize(s.nama,40),x+5,y+30);doc.text('Kelas: '+(s.kelas||'-'),x+5,y+44);gambarQR(doc,s.kode_qr,x+48,y+7,36)});
 doc.save('kartu-siswa.pdf')}catch(e){toast('Gagal membuat PDF: '+(e.message||e),false)}}
/* ---------- rekap + unduh riwayat ---------- */
const LB={Hadir:'H',Terlambat:'T',Izin:'I',Sakit:'S',Alpa:'A',Libur:'L',Belum:'-'};
function matriks(b,k){const ds=hariBulan(b),l=act().filter(s=>!k||s.kelas===k);return{ds,rows:l.map((s,i)=>{const r=ringkas(s,b);return[i+1,s.nama,s.kelas].concat(ds.map(d=>LB[dayStat(s,d)])).concat([r.c.Hadir,r.c.Terlambat,r.c.Izin,r.c.Sakit,r.c.Alpa,r.c.Libur,r.pct+'%'])}),head:['No','Nama','Kelas'].concat(ds.map(d=>+d.slice(8))).concat(['Hadir','Terlambat','Izin','Sakit','Alpa','Libur','% Hadir'])}}
V.rekap=()=>{const l=act().filter(s=>!rk||s.kelas===rk),n=hariBulan(bulan).length;
 const rows=l.map((s,i)=>{const r=ringkas(s,bulan);return `<tr><td>${i+1}</td><td><b>${esc(s.nama)}</b><div class="mu">${esc(s.kelas)}</div></td><td>${r.c.Hadir}</td><td>${r.c.Terlambat}</td><td>${r.c.Izin}</td><td>${r.c.Sakit}</td><td>${r.c.Alpa}</td><td>${r.c.Libur}</td><td><b>${r.pct}%</b></td></tr>`}).join('');
 return `<div class="panel"><div class="ph">▥ Rekap Absensi <span class="mu">${n} hari dihitung</span></div><div class="pb"><div class="tb">${dt('month',bulan,"setBulan(this.value)")}<select class="select" onchange="rk=this.value;renderV()">${kopt(rk,1)}</select></div>
 <div class="tb"><button class="btn success grow" onclick="unduh('pdf')">⬇ Unduh Riwayat Absensi (PDF)</button><button class="btn grow" onclick="unduh('xlsx')">⬇ Unduh Riwayat Absensi (XLSX)</button></div>
 <div class="note">Tabel di bawah adalah rekap jumlah bulan yang dipilih. Berkas unduhan berisi riwayat harian sebulan penuh seluruh anak (H hadir, T terlambat, I izin, S sakit, A alpa, L libur). Persentase menghitung hari libur sebagai hadir.</div>
 ${tab(['No','Nama','Hadir','Terlambat','Izin','Sakit','Alpa','Libur','% Hadir'],rows)}</div></div>`};
function setBulan(v){bulan=v;guard(async()=>{await muatBulan(v);renderV()})}
function unduh(t){guard(async()=>{await muatBulan(bulan);const M=matriks(bulan,rk);if(!M.ds.length||!M.rows.length)throw new Error('Belum ada data pada bulan ini');const nm='riwayat-absensi-'+bulan;
 if(t==='xlsx'){const ws=XLSX.utils.aoa_to_sheet([M.head].concat(M.rows)),wb=XLSX.utils.book_new();ws['!cols']=[{wch:4},{wch:24},{wch:8}];XLSX.utils.book_append_sheet(wb,ws,'Riwayat');XLSX.writeFile(wb,nm+'.xlsx')}
 else{const d=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});d.setFontSize(12);d.text('Riwayat Absensi - KB Nurul Qarnain - '+fmtB(bulan)+(rk?' - Kelas '+rk:''),8,10);
  d.autoTable({startY:14,head:[M.head],body:M.rows,styles:{fontSize:6,cellPadding:.8,halign:'center'},columnStyles:{1:{halign:'left',cellWidth:38}},headStyles:{fillColor:[21,148,71]},margin:{left:8,right:8}});
  d.setFontSize(7);d.text('H hadir, T terlambat, I izin, S sakit, A alpa, L libur, - belum tercatat. Persentase menghitung hari libur sebagai hadir.',8,d.lastAutoTable.finalY+5);d.save(nm+'.pdf')}})}
/* ---------- laporan orang tua ---------- */
const motiv=p=>p>90?'Luar biasa! Kehadiran ananda sangat baik. Pertahankan ya, Bapak/Ibu.':p>70?'Selamat! Kehadiran ananda baik. Tingkatkan lagi ya.':p>=50?'Kehadiran ananda cukup baik. Mari bersama-sama kita tingkatkan lagi.':'Mohon kerja samanya agar kehadiran ananda menjadi semakin baik ke depannya. Bila ada kendala, silakan hubungi kami.';
function pesanOrtu(s,b){const r=ringkas(s,b),ln=r.ds.map(d=>{const st=dayStat(s,d);return HR[wd(d)].slice(0,3)+', '+(+d.slice(8))+' '+BLN[+d.slice(5,7)-1].slice(0,3)+': '+(st==='Belum'?'Belum tercatat':st)});
 return `Assalamualaikum Bapak/Ibu, berikut riwayat kehadiran ananda ${s.nama} (Kelas ${s.kelas}) bulan ${fmtB(b)} di KB Nurul Qarnain:\n\n${ln.join('\n')||'Belum ada data.'}\n\nRingkasan:\n✅ Hadir: ${r.c.Hadir+r.c.Terlambat} hari`+(r.c.Terlambat?` (terlambat ${r.c.Terlambat} hari)`:'')+`\n🏖 Libur: ${r.c.Libur} hari\n📝 Izin: ${r.c.Izin} hari\n🤒 Sakit: ${r.c.Sakit} hari\n❌ Alpa: ${r.c.Alpa} hari\n\nPersentase kehadiran: ${r.pct}% (hari libur dihitung hadir)\n\n${motiv(r.pct)}\n\nTerima kasih.`}
V.laporanortu=()=>{const l=act().filter(s=>!lo||s.kelas===lo);
 const rows=l.map((s,i)=>{const r=ringkas(s,lb);return `<tr><td>${i+1}</td><td><b>${esc(s.pan)}</b><div class="mu">${esc(s.nama)}</div></td><td>${s.wa?esc(s.wa):'<span class="badge Sakit">Tanpa nomor</span>'}</td><td>${r.c.Hadir+r.c.Terlambat}H ${r.c.Izin}I ${r.c.Sakit}S ${r.c.Alpa}A ${r.c.Libur}L<div class="mu">${r.pct}% dari ${r.n} hari</div></td><td><button class="btn sm soft" onclick="lihatPesan(${s.id})">Lihat &amp; salin</button></td></tr>`}).join('');
 return `<div class="panel"><div class="ph">📨 Laporan ke Orang Tua</div><div class="pb"><div class="note">Pesan berisi riwayat kehadiran sebulan penuh setiap anak, ringkasan, dan kalimat penutup sesuai persentase. Pengiriman otomatis lewat WhatsApp diaktifkan di tahap berikutnya. Sementara ini pesan bisa dilihat dan disalin.</div>
 <div class="tb">${dt('month',lb,"setLb(this.value)")}<select class="select" onchange="lo=this.value;renderV()">${kopt(lo,1)}</select></div>${tab(['No','Anak','WhatsApp','Rekap','Aksi'],rows)}</div></div>`};
function setLb(v){lb=v;guard(async()=>{await muatBulan(v);renderV()})}
function lihatPesan(id){const s=S.siswa.find(x=>x.id===id),teks=pesanOrtu(s,lb);$('#mt').textContent='Pesan untuk orang tua '+s.pan;$('#mbd').innerHTML=`<pre style="white-space:pre-wrap;font:inherit;margin:0">${esc(teks)}</pre>`;$('#ms').textContent='Salin pesan';
 $('#ms').onclick=()=>{const ok=()=>toast('Pesan disalin');if(navigator.clipboard)navigator.clipboard.writeText(teks).then(ok,()=>toast('Gagal menyalin',false));else{const a=document.createElement('textarea');a.value=teks;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();ok()}};$('#md').classList.add('show')}
/* ---------- jadwal libur ---------- */
V.libur=()=>`<div class="panel"><div class="ph">🔁 Libur Mingguan Tetap</div><div class="pb"><div class="note">Hari yang dipilih libur setiap minggu. Server mengisi status Libur otomatis sesuai jadwal ini walau website tidak dibuka.</div><div class="chips">${[1,2,3,4,5,6,0].map(d=>`<button class="chip ${S.mingguan.includes(d)?'on':''}" onclick="togHari(${d})">${HR[d]}</button>`).join('')}</div></div></div>
<div class="panel"><div class="ph">📅 Libur Tanggal Tertentu <button class="btn success" onclick="addLibur()">+ Tambah Libur</button></div><div class="pb">${tab(['No','Tanggal','Kelas','Keterangan','Aksi'],S.libur.map((l,i)=>`<tr><td>${i+1}</td><td>${fmt(l.tgl)}${l.sampai&&l.sampai!==l.tgl?' - '+fmt(l.sampai):''}</td><td>${esc(l.kelas||'Semua')}</td><td>${esc(l.ket)}</td><td><button class="btn sm danger" onclick="delLibur(${l.id})">Hapus</button></td></tr>`).join(''))}</div></div>`;
function togHari(d){guard(async()=>{if(S.mingguan.includes(d))await dbq(db.from('libur_mingguan').delete().eq('hari',d));else await dbq(db.from('libur_mingguan').insert({hari:d}));await muatDasar();await segarkan();renderV()})}
function addLibur(){form('Tambah Libur',[{k:'tgl',l:'Mulai tanggal',t:'date',v:TODAY},{k:'sampai',l:'Sampai tanggal (kosongkan bila satu hari)',t:'date'},{k:'kelas',l:'Kelas',o:['Semua'].concat(S.kelas.map(k=>k.nama))},{k:'ket',l:'Keterangan'}],async v=>{if(!v.tgl)throw new Error('Pilih tanggal mulai');if(v.sampai&&v.sampai<v.tgl)throw new Error('Tanggal akhir sebelum tanggal mulai');
 await dbq(db.from('libur_tanggal').insert({mulai:v.tgl,sampai:v.sampai||v.tgl,kelas_id:v.kelas==='Semua'?null:kid(v.kelas),keterangan:v.ket||null}));await muatDasar();await segarkan();renderV()})}
function delLibur(id){if(!confirm('Hapus jadwal libur ini?'))return;guard(async()=>{await dbq(db.from('libur_tanggal').delete().eq('id',id));await muatDasar();await segarkan();renderV()})}
/* ---------- pesan WA ---------- */
V.pesan=()=>`<div class="panel"><div class="ph">💬 Pesan WhatsApp Masuk</div><div class="pb"><div class="note">Semua pesan dari orang tua tercatat di sini (100 terbaru). Yang tidak terbaca sistem ditandai perlu dicek.</div>${tab(['Waktu','Dari','Isi','Hasil','Aksi'],S.pesan.map(p=>`<tr><td>${esc(p.waktu)}</td><td>${esc(p.dari)}</td><td>${esc(p.isi)}</td><td>${esc(p.hasil)}</td><td>${p.cek?`<button class="btn sm orange" onclick="doneMsg(${p.id})">Tandai selesai</button>`:'<span class="mu">Selesai</span>'}</td></tr>`).join(''))}</div></div>`;
function doneMsg(id){guard(async()=>{await dbq(db.from('pesan_masuk').update({perlu_dicek:false}).eq('id',id));await muatPesan();renderV()})}
/* ---------- pengaturan ---------- */
V.pengaturan=()=>`<div class="panel"><div class="ph">🏫 Kelas dan Jam Masuk <button class="btn success" onclick="addKelas()">+ Tambah Kelas</button></div><div class="pb"><div class="note">Batas jam masuk menentukan status Terlambat saat scan. Perubahan tersimpan otomatis.</div><div class="cls">${S.kelas.map(k=>`<div class="ci"><b>Kelas ${esc(k.nama)}</b><span>Batas masuk <input type="time" class="input" value="${k.jam}" onchange="setJam(${k.id},this.value)"></span><button class="btn sm danger" onclick="delKelas(${k.id})">Hapus</button></div>`).join('')}</div></div></div>
<div class="panel"><div class="ph">⏰ Alpa Otomatis</div><div class="pb"><div class="note">Anak yang belum tercatat sampai jam ini otomatis berstatus Alpa (tidak berlaku di hari libur). Server memeriksa tiap 10 menit. Bila orang tua mengabari izin sesudahnya, statusnya diubah.</div>
<div class="tb"><label><input type="checkbox" ${S.set.alpa_aktif?'checked':''} onchange="setAlpa({alpa_aktif:this.checked})"> Aktifkan alpa otomatis</label><input type="time" class="input" value="${S.set.jam}" onchange="setAlpa({alpa_jam:this.value})"></div></div></div>
<div class="panel"><div class="ph">🎓 Tahun Ajaran <span class="mu">Sekarang: ${esc(S.set.tahun_ajaran||'-')}</span></div><div class="pb"><div class="note">Saat tahun ajaran berganti, seluruh data absensi lama dihapus dan absensi dimulai dari awal. Data siswa, guru, dan kelas tetap ada. Unduh riwayat tiap bulan (menu Rekap) sebelum menghapus.</div><button class="btn danger" onclick="tahunBaru()">Mulai tahun ajaran baru</button></div></div>`;
const setAlpa=o=>guard(async()=>{await dbq(db.from('pengaturan').update(o).eq('id',1));await muatDasar();toast('Pengaturan disimpan');renderV()});
function tahunBaru(){form('Mulai tahun ajaran baru',[{k:'label',l:'Tahun ajaran baru (contoh 2027/2028)'},{k:'ok',l:'Ketik HAPUS untuk menghapus semua data absensi lama'}],async v=>{if(!v.label||v.ok!=='HAPUS')throw new Error('Isi tahun ajaran dan ketik HAPUS');await dbq(db.rpc('mulai_tahun_ajaran',{label:v.label}));S.absen={};await muatDasar();toast('Data absensi lama dihapus');renderAll()})}
function addKelas(){form('Tambah Kelas',[{k:'nama',l:'Nama kelas'},{k:'jam',l:'Batas jam masuk',t:'time',v:'07:30'}],async v=>{if(!v.nama||S.kelas.some(k=>k.nama===v.nama))throw new Error('Nama kelas kosong atau sudah ada');await dbq(db.from('kelas').insert({nama:v.nama,jam_masuk:v.jam||'07:30'}));await muatDasar();renderV()})}
const setJam=(id,j)=>guard(async()=>{await dbq(db.from('kelas').update({jam_masuk:j}).eq('id',id));await muatDasar();toast('Jam masuk disimpan')});
function delKelas(id){const k=S.kelas.find(x=>x.id===id);if(S.siswa.some(s=>s.kelas_id===id))return toast('Masih ada siswa di kelas ini',false);if(!confirm('Hapus kelas '+k.nama+'?'))return;guard(async()=>{await dbq(db.from('kelas').delete().eq('id',id));await muatDasar();renderV()})}
/* ---------- developer ---------- */
async function runChecks(){const R=[],add=(l,n,d)=>R.push([l,n,d]),as=act(),nama=a=>a.map(s=>s.pan).join(', ');
 let t0=performance.now();try{await dbq(db.from('pengaturan').select('id').limit(1));add('ok','Koneksi Supabase','Tersambung ('+Math.round(performance.now()-t0)+' ms)')}catch(e){add('err','Koneksi Supabase',e.message)}
 add('ok','Sesi login',meNama+' ('+role+')');
 for(const t of ['kelas','siswa','wali','siswa_wali','absensi','profil','pengaturan','libur_mingguan','libur_tanggal','laporan_ortu','pesan_masuk','percakapan_tertunda']){try{const r=await db.from(t).select('*',{count:'exact',head:true});if(r.error)throw r.error;add('ok','Tabel '+t,r.count+' baris')}catch(e){add('err','Tabel '+t,e.message)}}
 for(const [n,u,k] of [['Webhook Fonnte','/api/webhook','aktif'],['API guru','/api/guru','aktif']]){try{const t=await (await fetch(u)).text();add(t.toLowerCase().includes(k)?'ok':'warn',n,t.toLowerCase().includes(k)?'Aktif':'Tidak merespons dengan benar')}catch(e){add('err',n,'Tidak bisa dihubungi')}}
 const sec=location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname),cam=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);add(sec&&cam?'ok':'warn','Kamera untuk scan',sec&&cam?'HTTPS dan kamera tersedia':'Kamera butuh HTTPS dan browser yang mendukung');
 add(typeof XLSX!=='undefined'&&window.jspdf&&window.Html5Qrcode&&window.qrcode?'ok':'warn','Pustaka XLSX, PDF, QR',typeof XLSX!=='undefined'&&window.jspdf&&window.Html5Qrcode&&window.qrcode?'Semua termuat':'Ada yang belum termuat (butuh internet)');
 const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;add(/Jakarta|Makassar|Jayapura|Pontianak/.test(tz)?'ok':'warn','Zona waktu perangkat',tz);
 const bk=as.filter(s=>!S.kelas.some(k=>k.nama===s.kelas));add(bk.length?'err':'ok','Kelas siswa',bk.length?'Kelas tidak dikenal: '+nama(bk):'Semua siswa aktif punya kelas');
 const nw=as.filter(s=>!s.wa);add(nw.length?'warn':'ok','Nomor WhatsApp orang tua',nw.length?nw.length+' anak belum punya nomor: '+nama(nw):'Semua siswa aktif punya nomor');
 const bf=as.filter(s=>s.wa&&!/^628\d{8,12}$/.test(s.wa));add(bf.length?'warn':'ok','Format nomor',bf.length?'Bukan format 628xxx: '+nama(bf):'Semua nomor berformat 628xxx');
 const g={};as.forEach(s=>{if(s.wa)(g[s.wa]=g[s.wa]||[]).push(s)});const kb=[];Object.values(g).forEach(a=>{const c={};a.forEach(s=>{const n=s.pan.toLowerCase();c[n]=(c[n]||0)+1});a.forEach(s=>{if(c[s.pan.toLowerCase()]>1)kb.push(s)})});add(kb.length?'err':'ok','Panggilan kembar dalam satu nomor',kb.length?'Balasan izin WhatsApp jadi ambigu: '+nama(kb):'Tidak ada');
 const ks=S.guru.filter(x=>x.role==='kepala_sekolah'&&x.aktif).length;add(ks?'ok':'err','Akun Kepala Sekolah',ks?ks+' akun aktif':'Tidak ada Kepala Sekolah aktif');
 add(S.mingguan.length?'ok':'info','Libur mingguan',S.mingguan.length?S.mingguan.map(d=>HR[d]).join(', '):'Belum ada hari libur mingguan');add('info','Alpa otomatis',S.set.alpa_aktif?'Aktif, jam '+S.set.jam:'Dimatikan');
 const bl=as.filter(s=>dayStat(s,TODAY)==='Belum');add('info','Absensi hari ini',bl.length?bl.length+' anak belum absen':'Semua sudah tercatat');
 return R}
const LV={ok:['Hadir','✓ Baik'],warn:['Terlambat','⚠ Perhatian'],err:['Sakit','✗ Masalah'],info:['Izin','ℹ Info']};
V.developer=()=>{const r=chk?chk.r:null,n=l=>r?r.filter(x=>x[0]===l).length:0;return `<div class="panel"><div class="ph">🛠 Developer Mode <button class="btn" onclick="jalankanCek()">↻ Periksa Sistem</button></div><div class="pb">
 <div class="cards"><div class="card stat"><b>${S.siswa.length}</b>Siswa</div><div class="card stat"><b>${S.guru.length}</b>Guru</div><div class="card stat"><b>${S.kelas.length}</b>Kelas</div></div>
 <div style="margin-top:14px"><b>Pemeriksaan sistem</b> ${r?`<span class="mu">terakhir ${chk.t}: ${n('ok')} baik, ${n('warn')} perhatian, ${n('err')} masalah</span>`:''}</div>
 ${r?tab(['Hasil','Pemeriksaan','Keterangan'],r.map(x=>`<tr><td><span class="badge ${LV[x[0]][0]}">${LV[x[0]][1]}</span></td><td><b>${x[1]}</b></td><td>${esc(x[2])}</td></tr>`).join('')):'<div class="note" style="margin-top:8px">Ketuk Periksa Sistem untuk memeriksa koneksi, tabel, webhook, kamera, dan kelengkapan data.</div>'}</div></div>`};
function jalankanCek(){guard(async()=>{toast('Memeriksa...');chk={t:new Date().toTimeString().slice(0,8),r:await runChecks()};renderV();toast('Pemeriksaan selesai')})}
mulai();setInterval(()=>{if(me&&view==='dashboard')muatRange(TODAY,TODAY).then(renderV).catch(()=>{})},60000);
</script></body></html>
