<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Absensi PAUD</title>
<style>
:root{--bg:#f4f8f7;--card:#fff;--ink:#16302f;--mute:#5d7472;--line:#d7e3e1;--main:#0f5c63;--h:#1f8a5b;--i:#2d6cc0;--s:#c07a12;--a:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#0f1c1c;--card:#172a29;--ink:#e6f1ef;--mute:#93aeab;--line:#2a4341;--main:#4fb3bd}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:40px}
.wrap{max-width:560px;margin:0 auto;padding:12px}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
h1{font-size:20px;margin:0}
h2{font-size:17px;margin:0 0 10px}
.tabs{display:flex;gap:6px;margin:6px 0 12px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:15px}
.tabs button.on{background:var(--main);color:#fff;border-color:var(--main)}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
input,select{width:100%;padding:11px;margin:4px 0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:16px}
label{font-size:14px;color:var(--mute)}
.btn{background:var(--main);color:#fff;border:0;padding:12px 16px;border-radius:10px;font-size:16px;width:100%}
.link{background:none;border:0;color:var(--main);padding:6px;font-size:14px;text-decoration:underline}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.nm{font-weight:600}.sub{font-size:13px;color:var(--mute)}
.st{display:flex;gap:5px}
.st button{width:40px;height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-weight:700}
.st button.on[data-s=hadir]{background:var(--h);border-color:var(--h);color:#fff}
.st button.on[data-s=izin]{background:var(--i);border-color:var(--i);color:#fff}
.st button.on[data-s=sakit]{background:var(--s);border-color:var(--s);color:#fff}
.st button.on[data-s=alpa]{background:var(--a);border-color:var(--a);color:#fff}
.sum{display:flex;gap:8px;flex-wrap:wrap;font-size:14px;margin:6px 0 10px}
.sum span{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:3px 10px}
#toast{position:fixed;left:12px;right:12px;bottom:16px;background:#16302f;color:#fff;padding:12px;border-radius:10px;display:none;text-align:center;max-width:536px;margin:0 auto}
.x{color:var(--a);background:none;border:0;font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hariIni = () => new Date().toLocaleDateString('sv-SE', {timeZone:'Asia/Jakarta'});
let db, kelas = [], siswa = [], absen = {}, tgl = hariIni(), tab = 'absen', filterKelas = '';

function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3500)}
function view(html){$('app').innerHTML = html}

async function init(){
  const u = localStorage.getItem('sb_url'), k = localStorage.getItem('sb_key');
  if(!u || !k) return setupView();
  db = supabase.createClient(u, k);
  const {data:{session}} = await db.auth.getSession();
  session ? main() : loginView();
}

function setupView(){
  view(`<div class="box"><h1>Sambungkan ke database</h1>
  <p class="sub">Isi sekali saja di HP ini. Data ada di Supabase: Project Settings, lalu API.</p>
  <label>Project URL</label><input id="u" placeholder="https://xxxx.supabase.co">
  <label>Publishable key (anon key)</label><input id="k">
  <button class="btn" onclick="simpanSetup()">Simpan</button></div>`);
}
function simpanSetup(){
  const u=$('u').value.trim(), k=$('k').value.trim();
  if(!u.startsWith('https://')||!k) return toast('Isi URL dan key dengan benar');
  localStorage.setItem('sb_url',u); localStorage.setItem('sb_key',k); init();
}

function loginView(){
  view(`<div class="box"><h1>Absensi PAUD</h1><p class="sub">Masuk sebagai guru</p>
  <label>Email</label><input id="em" type="email" autocomplete="username">
  <label>Password</label><input id="pw" type="password" autocomplete="current-password">
  <button class="btn" onclick="masuk()">Masuk</button>
  <button class="link" onclick="localStorage.clear();setupView()">Ubah koneksi database</button></div>`);
}
async function masuk(){
  const {error} = await db.auth.signInWithPassword({email:$('em').value.trim(), password:$('pw').value});
  error ? toast('Gagal masuk: '+error.message) : main();
}
async function keluar(){ await db.auth.signOut(); loginView(); }

async function main(){
  view('<p class="sub">Memuat data...</p>');
  const [k, s] = await Promise.all([
    db.from('kelas').select('*').eq('aktif',true).order('id'),
    db.from('siswa').select('*, siswa_wali(wali(no_wa))').order('nama')
  ]);
  if(k.error || s.error) return toast('Gagal memuat: '+(k.error||s.error).message);
  kelas = k.data; siswa = s.data.filter(x => x.aktif); siswaOff = s.data.filter(x => !x.aktif);
  await muatAbsen();
  render();
}
async function muatAbsen(){
  const {data,error} = await db.from('absensi').select('*').eq('tanggal', tgl);
  if(error) return toast('Gagal memuat absen: '+error.message);
  absen = {}; data.forEach(r => absen[r.siswa_id] = r);
}

function render(){
  stopScan();
  view(`<header><h1>Absensi PAUD</h1><button class="link" onclick="keluar()">Keluar</button></header>
  <div class="tabs"><button class="${tab=='absen'?'on':''}" onclick="tab='absen';render()">Absen</button>
  <button class="${tab=='scan'?'on':''}" onclick="tab='scan';render()">Scan</button>
  <button class="${tab=='siswa'?'on':''}" onclick="tab='siswa';render()">Siswa</button>
  <button class="${tab=='laporan'?'on':''}" onclick="tab='laporan';render()">Laporan</button></div>
  ${tab=='absen' ? absenHTML() : tab=='scan' ? scanHTML() : tab=='laporan' ? laporanHTML() : siswaHTML()}`);
}

function absenHTML(){
  const list = siswa.filter(s => !filterKelas || s.kelas_id == filterKelas);
  const c = {hadir:0,izin:0,sakit:0,alpa:0,belum:0};
  list.forEach(s => absen[s.id] ? c[absen[s.id].status]++ : c.belum++);
  const rows = list.map(s => {
    const a = absen[s.id], st = a ? a.status : '';
    const info = a ? [a.cara, a.jam_datang ? new Date(a.jam_datang).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Jakarta'}) : '', a.catatan].filter(Boolean).join(' - ') : 'belum absen';
    const b = (k,l) => `<button data-s="${k}" class="${st==k?'on':''}" onclick="setStatus(${s.id},'${k}')">${l}</button>`;
    return `<div class="row"><div><div class="nm">${esc(s.nama_panggilan)}</div><div class="sub">${esc(s.nama)}<br>${esc(info)}</div></div>
    <div class="st">${b('hadir','H')}${b('izin','I')}${b('sakit','S')}${b('alpa','A')}</div></div>`;
  }).join('') || '<p class="sub">Belum ada siswa. Tambahkan di tab Siswa.</p>';
  return `<div class="box"><label>Tanggal</label><input type="date" value="${tgl}" onchange="tgl=this.value;muatAbsen().then(render)">
  <label>Kelas</label><select onchange="filterKelas=this.value;render()"><option value="">Semua kelas</option>
  ${kelas.map(k=>`<option value="${k.id}" ${filterKelas==k.id?'selected':''}>${esc(k.nama)}</option>`).join('')}</select>
  <div class="sum"><span>Hadir ${c.hadir}</span><span>Izin ${c.izin}</span><span>Sakit ${c.sakit}</span><span>Alpa ${c.alpa}</span><span>Belum ${c.belum}</span></div>
  <p class="sub" style="margin:0">H hadir, I izin, S sakit, A alpa</p></div>
  <div class="box">${rows}</div>`;
}

async function setStatus(id, st){
  let cat = absen[id]?.catatan || null;
  if(st !== 'hadir'){ cat = prompt('Catatan (boleh kosong)', cat || ''); if(cat === null) return; }
  const row = {siswa_id:id, tanggal:tgl, status:st, cara:'manual', catatan:cat||null, diubah:new Date().toISOString(),
    jam_datang: st=='hadir' ? (absen[id]?.jam_datang || new Date().toISOString()) : null};
  const {error} = await db.from('absensi').upsert(row, {onConflict:'siswa_id,tanggal'});
  if(error) return toast('Gagal menyimpan: '+error.message);
  absen[id] = row; render();
}

function siswaHTML(){
  const rows = siswa.map(s => {
    const k = kelas.find(x => x.id == s.kelas_id);
    const wa = (s.siswa_wali||[]).map(w => w.wali?.no_wa).filter(Boolean).join(', ');
    return `<div class="row"><div><div class="nm">${esc(s.nama_panggilan)}</div><div class="sub">${esc(s.nama)} - ${esc(k?k.nama:'tanpa kelas')}<br>${esc(wa||'nomor WA belum diisi')}</div></div>
    <button class="x" onclick="hapusSiswa(${s.id})">Nonaktifkan</button></div>`;
  }).join('') || '<p class="sub">Belum ada siswa.</p>';
  return `<div class="box"><h2>Kartu siswa</h2><label>Kelas yang dicetak</label>
  <select id="kk"><option value="">Semua kelas</option>${kelas.map(k=>`<option value="${k.id}">${esc(k.nama)}</option>`).join('')}</select>
  <button class="btn" onclick="unduhKartu()">Unduh kartu (PDF)</button></div>
  <div class="box"><h2>Tambah siswa</h2>
  <label>Nama lengkap</label><input id="sn"><label>Nama panggilan</label><input id="sp">
  <label>Kelas</label><select id="sk">${kelas.map(k=>`<option value="${k.id}">${esc(k.nama)}</option>`).join('')}</select>
  <label>Nomor WhatsApp orang tua (contoh 08123456789)</label><input id="sw" type="tel">
  <button class="btn" onclick="tambahSiswa()">Simpan siswa</button></div>
  <div class="box"><h2>Daftar siswa (${siswa.length})</h2>${rows}</div>
  ${siswaOff.length ? `<div class="box"><h2>Siswa nonaktif (${siswaOff.length})</h2>${siswaOff.map(s => `<div class="row"><div><div class="nm">${esc(s.nama_panggilan)}</div><div class="sub">${esc(s.nama)}</div></div><button class="x" style="color:var(--h)" onclick="aktifkanSiswa(${s.id})">Aktifkan kembali</button></div>`).join('')}</div>` : ''}`;
}

function normWA(n){
  let d = String(n||'').replace(/\D/g,'');
  if(d.startsWith('0')) d = '62'+d.slice(1);
  else if(d.startsWith('8')) d = '62'+d;
  return d;
}

async function tambahSiswa(){
  const nama=$('sn').value.trim(), pan=$('sp').value.trim(), kid=$('sk').value, wa=normWA($('sw').value);
  if(!nama||!pan) return toast('Nama lengkap dan panggilan wajib diisi');
  const {data:s, error} = await db.from('siswa').insert({nama, nama_panggilan:pan, kelas_id:kid||null}).select().single();
  if(error) return toast('Gagal menyimpan: '+error.message);
  if(wa){
    const w = await db.from('wali').upsert({no_wa:wa}, {onConflict:'no_wa'}).select().single();
    if(w.error) toast('Siswa tersimpan, nomor WA gagal: '+w.error.message);
    else await db.from('siswa_wali').insert({siswa_id:s.id, wali_id:w.data.id});
  }
  toast('Siswa tersimpan'); main();
}

async function aktifkanSiswa(id){
  const {error} = await db.from('siswa').update({aktif:true}).eq('id', id);
  error ? toast('Gagal: '+error.message) : main();
}

async function hapusSiswa(id){
  if(!confirm('Nonaktifkan siswa ini? Riwayat absen tetap tersimpan.')) return;
  const {error} = await db.from('siswa').update({aktif:false}).eq('id', id);
  error ? toast('Gagal: '+error.message) : main();
}

/* ---------- Scanner ---------- */
let siswaOff = [], scanner = null, busy = false, lastKode = '', lastAt = 0, logScan = [];
const jam = iso => iso ? new Date(iso).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Jakarta'}) : '';

function scanHTML(){
  return `<div class="box"><h2>Scan kartu</h2>
  <p class="sub">Arahkan kamera ke QR di kartu anak. Tercatat hadir untuk hari ini (${hariIni()}).</p>
  <div id="reader" style="width:100%"></div>
  <button class="btn" id="bs" onclick="toggleScan()">Nyalakan kamera</button>
  <div id="hasil" style="margin-top:10px;font-weight:600"></div></div>
  <div class="box"><h2>Tercatat lewat scan</h2><div id="log"><p class="sub">Belum ada.</p></div></div>`;
}
async function toggleScan(){
  if(scanner) return stopScan();
  scanner = new Html5Qrcode('reader');
  try{
    await scanner.start({facingMode:'environment'}, {fps:10, qrbox:{width:220,height:220}}, onScan, ()=>{});
    $('bs').textContent = 'Matikan kamera';
  }catch(e){ scanner = null; toast('Kamera tidak bisa dibuka. Izinkan akses kamera untuk situs ini.'); }
}
async function stopScan(){
  if(!scanner) return;
  const s = scanner; scanner = null;
  try{ await s.stop(); s.clear(); }catch(e){}
  const b = $('bs'); if(b) b.textContent = 'Nyalakan kamera';
}
function hasil(msg, ok){
  const h = $('hasil'); if(!h) return;
  h.textContent = msg; h.style.color = ok ? 'var(--h)' : 'var(--a)';
  if(navigator.vibrate) navigator.vibrate(ok ? 120 : [80,60,80]);
}
async function onScan(kode){
  const now = Date.now();
  if(busy || (kode === lastKode && now - lastAt < 4000)) return;
  busy = true; lastKode = kode; lastAt = now;
  try{
    const s = siswa.find(x => x.kode_qr === kode);
    if(!s) return hasil('QR tidak dikenal atau siswa tidak aktif.', false);
    const t = hariIni();
    const {data:ada, error:e1} = await db.from('absensi').select('*').eq('siswa_id', s.id).eq('tanggal', t).maybeSingle();
    if(e1) return hasil('Gagal cek data: '+e1.message, false);
    if(ada && ada.status === 'hadir') return hasil(`${s.nama_panggilan} sudah tercatat hadir jam ${jam(ada.jam_datang)}.`, false);
    if(ada && !confirm(`${s.nama_panggilan} tercatat ${ada.status} hari ini. Ubah menjadi hadir?`)) return;
    const row = {siswa_id:s.id, tanggal:t, status:'hadir', cara:'scan', jam_datang:new Date().toISOString(),
      catatan: ada ? ada.catatan : null, diubah:new Date().toISOString()};
    const {error} = await db.from('absensi').upsert(row, {onConflict:'siswa_id,tanggal'});
    if(error) return hasil('Gagal menyimpan: '+error.message, false);
    if(t === tgl) absen[s.id] = row;
    hasil(`${s.nama_panggilan} hadir, jam ${jam(row.jam_datang)}.`, true);
    logScan.unshift(`${jam(row.jam_datang)} - ${s.nama_panggilan}`);
    const l = $('log'); if(l) l.innerHTML = logScan.map(x => `<div class="row">${esc(x)}</div>`).join('');
  } finally { busy = false; }
}

/* ---------- Kartu PDF ---------- */
function gambarQR(doc, kode, x, y, size){
  const q = qrcode(0, 'M'); q.addData(kode); q.make();
  const n = q.getModuleCount(), qz = 2, cell = size / (n + qz*2);
  doc.setFillColor(255,255,255); doc.rect(x, y, size, size, 'F');
  doc.setFillColor(0,0,0);
  for(let r=0; r<n; r++) for(let c=0; c<n; c++)
    if(q.isDark(r,c)) doc.rect(x+(c+qz)*cell, y+(r+qz)*cell, cell+0.03, cell+0.03, 'F');
}
function unduhKartu(){
  const kid = $('kk').value;
  const list = siswa.filter(s => !kid || s.kelas_id == kid);
  if(!list.length) return toast('Tidak ada siswa untuk dicetak');
  const doc = new window.jspdf.jsPDF({unit:'mm', format:'a4'});
  const W=90, H=50, mx=15, my=23;
  list.forEach((s,i) => {
    if(i>0 && i%10===0) doc.addPage();
    const p = i%10, x = mx+(p%2)*W, y = my+Math.floor(p/2)*H;
    doc.setDrawColor(15,92,99); doc.setLineWidth(0.4); doc.rect(x+1, y+1, W-2, H-2);
    doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(15,92,99);
    doc.text('KB NURUL QARNAIN', x+5, y+8);
    doc.setFontSize(15); doc.setTextColor(0,0,0);
    doc.text(doc.splitTextToSize(s.nama_panggilan, 40), x+5, y+20);
    doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
    doc.text(doc.splitTextToSize(s.nama, 40), x+5, y+30);
    const k = kelas.find(z => z.id == s.kelas_id);
    doc.text('Kelas: '+(k ? k.nama : '-'), x+5, y+44);
    gambarQR(doc, s.kode_qr, x+48, y+7, 36);
  });
  doc.save('kartu-siswa.pdf');
}

/* ---------- Laporan ---------- */
function laporanHTML(){
  return `<div class="box"><h2>Laporan bulanan</h2>
  <label>Bulan</label><input type="month" id="lb" value="${hariIni().slice(0,7)}">
  <label>Kelas</label><select id="lk"><option value="">Semua kelas</option>${kelas.map(k=>`<option value="${k.id}">${esc(k.nama)}</option>`).join('')}</select>
  <button class="btn" onclick="unduhXLSX()">Unduh Excel (XLSX)</button>
  <div style="height:8px"></div>
  <button class="btn" onclick="unduhPDF()">Unduh PDF</button>
  <p class="sub">Hari efektif dihitung dari tanggal yang punya catatan absensi pada bulan itu. Laporan memuat siswa aktif.</p></div>`;
}

async function ambilLaporan(){
  const bln = $('lb').value, kid = $('lk').value;
  if(!bln) throw new Error('Pilih bulan dulu');
  const [y,m] = bln.split('-').map(Number);
  const awal = bln+'-01', akhir = bln+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0');
  let rows = [], dari = 0;
  while(true){
    const {data,error} = await db.from('absensi').select('*').gte('tanggal',awal).lte('tanggal',akhir).order('tanggal').range(dari, dari+999);
    if(error) throw error;
    rows = rows.concat(data);
    if(data.length < 1000) break;
    dari += 1000;
  }
  const daftar = siswa.filter(s => !kid || s.kelas_id == kid);
  const ids = new Set(daftar.map(s => s.id));
  rows = rows.filter(r => ids.has(r.siswa_id));
  const hari = new Set(rows.map(r => r.tanggal)).size;
  const nk = id => (kelas.find(k => k.id == id) || {}).nama || '-';
  const rekap = daftar.map((s,i) => {
    const r = rows.filter(x => x.siswa_id === s.id);
    const c = st => r.filter(x => x.status === st).length;
    const h = c('hadir'), iz = c('izin'), sk = c('sakit'), al = c('alpa');
    return {No:i+1, Nama:s.nama, Panggilan:s.nama_panggilan, Kelas:nk(s.kelas_id), Hadir:h, Izin:iz, Sakit:sk, Alpa:al,
      'Belum tercatat':Math.max(hari-(h+iz+sk+al),0), '% Hadir':hari ? Math.round(h*100/hari) : 0};
  });
  const nama = Object.fromEntries(daftar.map(s => [s.id, s]));
  const detail = rows.map(r => ({Tanggal:r.tanggal, Nama:nama[r.siswa_id].nama, Kelas:nk(nama[r.siswa_id].kelas_id),
    Status:r.status, 'Jam datang':jam(r.jam_datang), Cara:r.cara, Catatan:r.catatan||''}));
  const label = new Date(y,m-1,1).toLocaleDateString('id-ID',{month:'long',year:'numeric'});
  const kls = kid ? nk(kid) : 'Semua kelas';
  return {bln, label, kls, hari, rekap, detail};
}

async function unduhXLSX(){
  try{
    const L = await ambilLaporan();
    if(!L.detail.length) return toast('Belum ada data absensi di bulan ini');
    const wb = XLSX.utils.book_new();
    const w1 = XLSX.utils.json_to_sheet(L.rekap);
    w1['!cols'] = [{wch:4},{wch:26},{wch:14},{wch:10},{wch:8},{wch:8},{wch:8},{wch:8},{wch:14},{wch:9}];
    const w2 = XLSX.utils.json_to_sheet(L.detail);
    w2['!cols'] = [{wch:12},{wch:26},{wch:10},{wch:9},{wch:11},{wch:10},{wch:40}];
    XLSX.utils.book_append_sheet(wb, w1, 'Rekap');
    XLSX.utils.book_append_sheet(wb, w2, 'Detail');
    XLSX.writeFile(wb, `laporan-absensi-${L.bln}.xlsx`);
  }catch(e){ toast('Gagal membuat laporan: '+(e.message||e)); }
}

async function unduhPDF(){
  try{
    const L = await ambilLaporan();
    if(!L.detail.length) return toast('Belum ada data absensi di bulan ini');
    const doc = new window.jspdf.jsPDF({unit:'mm', format:'a4'});
    doc.setFont('helvetica','bold'); doc.setFontSize(14);
    doc.text('Laporan Kehadiran - KB Nurul Qarnain', 14, 16);
    doc.setFont('helvetica','normal'); doc.setFontSize(10);
    doc.text(`Bulan: ${L.label}   |   Kelas: ${L.kls}   |   Hari efektif: ${L.hari}`, 14, 23);
    doc.autoTable({startY:28, styles:{fontSize:8.5}, headStyles:{fillColor:[15,92,99]},
      head:[['No','Nama','Kelas','Hadir','Izin','Sakit','Alpa','Belum','% Hadir']],
      body:L.rekap.map(r => [r.No, r.Nama, r.Kelas, r.Hadir, r.Izin, r.Sakit, r.Alpa, r['Belum tercatat'], r['% Hadir']+'%'])});
    const ket = L.detail.filter(d => d.Status !== 'hadir');
    if(ket.length){
      let y = doc.lastAutoTable.finalY + 10;
      if(y > 275){ doc.addPage(); y = 20; }
      doc.setFont('helvetica','bold'); doc.setFontSize(11);
      doc.text('Keterangan izin, sakit, dan alpa', 14, y);
      doc.autoTable({startY:y+3, styles:{fontSize:8.5}, headStyles:{fillColor:[15,92,99]},
        head:[['Tanggal','Nama','Status','Catatan']],
        body:ket.map(d => [d.Tanggal, d.Nama, d.Status, d.Catatan])});
    }
    doc.save(`laporan-absensi-${L.bln}.pdf`);
  }catch(e){ toast('Gagal membuat laporan: '+(e.message||e)); }
}

init();
</script>
</body>
